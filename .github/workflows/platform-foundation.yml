name: Platform foundation checks (no deployment)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install pinned test dependencies (no app framework)
        run: npm ci --ignore-scripts
      - name: Protected files, knowledge, permissions and PostgreSQL transactions
        run: npm run check
      - name: Install the browser pinned to Playwright
        run: npx playwright install --with-deps chromium firefox
      - name: Isolated review tool, four languages, filters and accessibility
        run: npm run test:review
      - name: Homepage before/after - pinned Firefox, 64 cases, zero pixel tolerance
        run: npm run test:visual
      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-evidence
          path: platform/test-results/
          if-no-files-found: warn
          retention-days: 7

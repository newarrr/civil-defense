# لوحة إدارة الموقع — Sveltia CMS (يعمل داخل GitHub Pages بدون خادم)
# الدخول: بحساب GitHub له صلاحية الكتابة على المستودع newarrr/civil-defense
backend:
  name: github
  repo: newarrr/civil-defense
  branch: main
  commit_messages:
    create: "محتوى: إنشاء {{collection}} «{{slug}}»"
    update: "محتوى: تحديث {{collection}} «{{slug}}»"
    delete: "محتوى: حذف {{collection}} «{{slug}}»"
    uploadMedia: "صور: رفع {{path}}"
    deleteMedia: "صور: حذف {{path}}"

site_url: https://newarrr.github.io/civil-defense/
display_url: https://newarrr.github.io/civil-defense/
logo_url: ../assets/civil-defense-logo.png

media_folder: assets/uploads
public_folder: assets/uploads

# الصور تُحوَّل تلقائيًا إلى WebP بعرض أقصى 1600 بكسل قبل الرفع، والحد الأقصى للملف 10 ميغابايت.
media_libraries:
  default:
    config:
      max_file_size: 10000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

collections:
  # ---------------------------------------------------------------- الأخبار
  - name: news
    label: الأخبار والفعاليات
    description: تظهر في بطاقات الأخبار في الصفحة الرئيسية وفي قائمة «المصادر والتحديثات».
    files:
      - name: news
        label: الأخبار
        file: content/news.json
        format: json
        fields:
          - name: items
            label: الأخبار (الأحدث أولًا)
            label_singular: خبر
            widget: list
            summary: "{{fields.date}} — {{fields.ar.title}} {{fields.published | ternary('', '· مسودة')}}"
            add_to_top: true
            fields:
              - { name: published, label: "منشور (ألغِ التفعيل لحفظه كمسودة غير ظاهرة)", widget: boolean, default: true }
              - name: category
                label: التصنيف
                widget: select
                default: news
                options:
                  - { label: خبر, value: news }
                  - { label: فعالية / نشاط, value: event }
                  - { label: عملية ميدانية, value: operation }
                  - { label: تدريب وتوعية, value: training }
                  - { label: إعلان, value: announcement }
              - { name: slug, label: "معرّف الرابط (حروف إنجليزية وشرطات، مثل: training-day-2026)", widget: string, pattern: ["^[a-z0-9-]+$", "حروف إنجليزية صغيرة وأرقام وشرطات فقط"] }
              - { name: date, label: التاريخ, widget: datetime, time_format: false, format: YYYY-MM-DD, date_format: YYYY-MM-DD }
              - { name: image, label: صورة الغلاف, widget: image, required: false }
              - { name: image_alt, label: "وصف الصورة (للمكفوفين ومحركات البحث)", widget: string, required: false }
              - name: gallery
                label: معرض الصور (اختياري)
                label_singular: صورة
                widget: list
                required: false
                field: { name: image, label: صورة, widget: image }
              - { name: video, label: "رابط فيديو YouTube أو Vimeo (اختياري)", widget: string, required: false }
              - name: ar
                label: العربية
                widget: object
                fields:
                  - { name: title, label: العنوان, widget: string }
                  - { name: excerpt, label: ملخص قصير, widget: text, required: false }
                  - { name: body, label: "النص (سطر فارغ = فقرة جديدة، وسطر يبدأ بـ - = نقطة)", widget: text, required: false }
              - name: badini
                label: بادینی
                widget: object
                collapsed: true
                fields:
                  - { name: title, label: ناڤ, widget: string, required: false }
                  - { name: excerpt, label: کورتی, widget: text, required: false }
                  - { name: body, label: دەق, widget: text, required: false }
              - name: sorani
                label: سۆرانی
                widget: object
                collapsed: true
                fields:
                  - { name: title, label: ناونیشان, widget: string, required: false }
                  - { name: excerpt, label: کورتە, widget: text, required: false }
                  - { name: body, label: دەق, widget: text, required: false }
              - name: en
                label: English
                widget: object
                collapsed: true
                fields:
                  - { name: title, label: Title, widget: string, required: false }
                  - { name: excerpt, label: Summary, widget: text, required: false }
                  - { name: body, label: "Text (blank line = new paragraph)", widget: text, required: false }

  # ------------------------------------------------------------- التنبيهات
  - name: alerts
    label: التنبيهات العامة
    description: شريط ملوّن أعلى كل الصفحات. يختفي تلقائيًا بعد وقت الانتهاء أو عند إلغاء التفعيل.
    files:
      - name: alerts
        label: التنبيهات
        file: content/alerts.json
        format: json
        fields:
          - name: items
            label: التنبيهات
            label_singular: تنبيه
            widget: list
            summary: "{{fields.level}} — {{fields.ar.title}}"
            fields:
              - { name: active, label: مفعّل, widget: boolean, default: true }
              - name: level
                label: المستوى
                widget: select
                default: advisory
                options:
                  - { label: "إرشادي (أزرق)", value: advisory }
                  - { label: "مراقبة (برتقالي)", value: watch }
                  - { label: "تحذير (أحمر)", value: warning }
              - { name: expires, label: ينتهي في, widget: datetime, required: false }
              - name: ar
                label: العربية
                widget: object
                fields:
                  - { name: title, label: العنوان, widget: string }
                  - { name: message, label: الرسالة, widget: text }
              - name: badini
                label: بادینی
                widget: object
                collapsed: true
                fields:
                  - { name: title, label: ناڤ, widget: string, required: false }
                  - { name: message, label: نامە, widget: text, required: false }
              - name: sorani
                label: سۆرانی
                widget: object
                collapsed: true
                fields:
                  - { name: title, label: ناونیشان, widget: string, required: false }
                  - { name: message, label: پەیام, widget: text, required: false }
              - name: en
                label: English
                widget: object
                collapsed: true
                fields:
                  - { name: title, label: Title, widget: string, required: false }
                  - { name: message, label: Message, widget: text, required: false }

  # ------------------------------------------------------------- القائمة
  - name: menu
    label: القائمة العلوية
    description: روابط إضافية داخل قوائم الشريط العلوي، ومكان آخر الأخبار.
    files:
      - name: menu
        label: القائمة العلوية
        file: content/menu.json
        format: json
        fields:
          - name: latestNews
            label: آخر الأخبار في القائمة
            widget: object
            fields:
              - { name: show, label: إظهار, widget: boolean, default: true }
              - name: group
                label: في قائمة
                widget: select
                default: sources
                options: &groups
                  - { label: عن الدفاع المدني, value: about }
                  - { label: دليل الخدمات, value: services }
                  - { label: التوعية والوقاية, value: safety }
                  - { label: المصادر والتحديثات, value: sources }
                  - { label: التواصل والمساعدة, value: contact }
              - { name: count, label: العدد, widget: number, value_type: int, min: 1, max: 6, default: 3 }
          - name: links
            label: روابط إضافية
            label_singular: رابط
            widget: list
            required: false
            summary: "{{fields.group}} — {{fields.ar}}"
            fields:
              - { name: group, label: القائمة, widget: select, options: *groups }
              - { name: url, label: "الرابط (مثل training.html أو tel:115 أو https://...)", widget: string, pattern: ["^(https://\\S+|tel:[+0-9]+|[a-z0-9-]+\\.html(#[A-Za-z0-9_-]+)?)$", "صفحة من الموقع أو tel: أو رابط https://"] }
              - name: position
                label: المكان
                widget: select
                default: end
                options:
                  - { label: بعد الروابط الأصلية, value: end }
                  - { label: قبل الروابط الأصلية, value: start }
              - { name: ar, label: العنوان بالعربية, widget: string }
              - { name: badini, label: ناڤ ب بادینی, widget: string, required: false }
              - { name: sorani, label: ناونیشان بە سۆرانی, widget: string, required: false }
              - { name: en, label: Title in English, widget: string, required: false }

  # ------------------------------------------------------------- الإحصائيات
  - name: stats
    label: الإحصائيات
    description: الأرقام في أسفل الصفحة الرئيسية. لا يظهر الرقم إلا بعد تفعيل «معتمد»، وإلا تبقى العبارة «بانتظار البيانات».
    files:
      - name: stats
        label: أرقام الصفحة الرئيسية
        file: content/stats.json
        format: json
        fields:
          - name: responseRate
            label: "نسبة الاستجابة للطوارئ (مثل 98%)"
            widget: object
            collapsed: true
            fields:
              - { name: value, label: الرقم, widget: string, required: false }
              - { name: period, label: "الفترة (مثل 2025)", widget: string, required: false }
              - { name: approved, label: معتمد من المديرية, widget: boolean, default: false }
          - name: beneficiaries
            label: "المستفيدون من التوعية"
            widget: object
            collapsed: true
            fields:
              - { name: value, label: الرقم, widget: string, required: false }
              - { name: period, label: "الفترة (مثل 2025)", widget: string, required: false }
              - { name: approved, label: معتمد من المديرية, widget: boolean, default: false }
          - name: centerCount
            label: "عدد مراكز الدفاع المدني"
            widget: object
            collapsed: true
            fields:
              - { name: value, label: الرقم, widget: string, required: false }
              - { name: period, label: "الفترة (مثل 2025)", widget: string, required: false }
              - { name: approved, label: معتمد من المديرية, widget: boolean, default: false }
          - name: staff
            label: "عدد المنتسبين"
            widget: object
            collapsed: true
            fields:
              - { name: value, label: الرقم, widget: string, required: false }
              - { name: period, label: "الفترة (مثل 2025)", widget: string, required: false }
              - { name: approved, label: معتمد من المديرية, widget: boolean, default: false }
          - name: rescueCount
            label: "عمليات الإنقاذ والإطفاء"
            widget: object
            collapsed: true
            fields:
              - { name: value, label: الرقم, widget: string, required: false }
              - { name: period, label: "الفترة (مثل 2025)", widget: string, required: false }
              - { name: approved, label: معتمد من المديرية, widget: boolean, default: false }

  # ---------------------------------------------------------------- المراكز
  - name: centers
    label: مراكز الدفاع المدني
    description: تظهر في صفحة «حالة الخدمات» قسم المراكز. لا يظهر المركز إلا بعد تفعيل «تم التحقق».
    files:
      - name: centers
        label: المراكز
        file: content/centers.json
        format: json
        fields:
          - name: items
            label: المراكز
            label_singular: مركز
            widget: list
            summary: "{{fields.ar.name}} — {{fields.ar.district}} {{fields.verified | ternary('✓', '· غير مؤكد')}}"
            fields:
              - { name: verified, label: تم التحقق من البيانات, widget: boolean, default: false }
              - { name: phone, label: الهاتف, widget: string, required: false, pattern: ["^[+0-9 ]{3,20}$", "أرقام فقط"] }
              - { name: map, label: "رابط الخريطة (Google Maps أو OpenStreetMap)", widget: string, required: false, pattern: ['^https://\S+$', "رابط يبدأ بـ https://"] }
              - name: ar
                label: العربية
                widget: object
                fields:
                  - { name: name, label: اسم المركز, widget: string }
                  - { name: district, label: القضاء / الناحية, widget: string }
                  - { name: hours, label: أوقات العمل, widget: string, required: false }
              - name: badini
                label: بادینی
                widget: object
                collapsed: true
                fields:
                  - { name: name, label: ناڤێ ناڤەندێ, widget: string, required: false }
                  - { name: district, label: قەزا, widget: string, required: false }
                  - { name: hours, label: دەمێن کاری, widget: string, required: false }
              - name: sorani
                label: سۆرانی
                widget: object
                collapsed: true
                fields:
                  - { name: name, label: ناوی ناوەند, widget: string, required: false }
                  - { name: district, label: قەزا, widget: string, required: false }
                  - { name: hours, label: کاتی کار, widget: string, required: false }
              - name: en
                label: English
                widget: object
                collapsed: true
                fields:
                  - { name: name, label: Center name, widget: string, required: false }
                  - { name: district, label: District, widget: string, required: false }
                  - { name: hours, label: Hours, widget: string, required: false }
